            <div class="markdown-content" id="md-page-49"></div>
            <script>
                document.getElementById('md-page-49').innerHTML = marked.parse(`\n\n\\section*{CHAPTER II.}\n\n\n\\section*{MAGNETIC FORCE AND MAGNETIC INDUCTION.}\n\n395.] We have already (Art. 385) determined the magnetic\n potential at a given point due to a magnet, the magnetization of\n which is given at every point of its substance, and we have\n shewn that the mathematical result may be expressed either in\n terms of the actual magnetization of every element of the\n magnet, or in terms of an imarinary distribution of 'magnetic\n matter,' partly condensed on the surface of the magnet and\n partly diffused throughout its substance.\n\n\nThe magnetic potential, as thus defined, is found by the same\n mathematical process, whether the given point is outside the\n magnet or within it. The force exerted on a unit magnetic pole\n placed at any point outside the magnet is deduced from the\n potential by the same process of differentiation as in the cor\nresponding electrical problem. If the components of this force\n are $\\alpha, \\beta, \\gamma$,\n\n$$\\begin{equation*}\n\\alpha=-\\frac{d V}{d x}, \\quad \\beta=-\\frac{d V}{d y}, \\quad \\gamma=-\\frac{d V}{d z} . \\tag{1}\n\\end{equation*}$$\n\n\nTo determine by experiment the magnetic force at a point\n within the magnet we must begin by removing part of the\n magnetized substance, so as to form a cavity within which we\n are to place the magnetic pole. The force acting on the pole\n will depend, in general, on the form of this cavity, and on the\n inclination of the walls of the cavity to the direction of mag\nnetization. Hence it is necessary, in order to avoid ambiguity\n in speaking of the magnetic force within a magnet, to specify\n the form and position of the cavity within which the force is to\n be measured. It is manifest that when the form and position\n of the cavity is specified, the point within it at which the`);
            </script>

    <div class="page-container">
        <div class="page-header">
            <span>Page 50</span>
        </div>
        
            <div class="markdown-content" id="md-page-50"></div>
            <script>
                document.getElementById('md-page-50').innerHTML = marked.parse(`\nmagnetic pole is placed must be regarded as no longer within\n the substance of the magnet, and therefore the ordinary methods\n of determining the force become at once applicable.\n\n396.] Let us now consider a portion of a magnet in which\n the direction and intensity of the magnetization are uniform.\n Within this portion let a cavity be hollowed out in the form\n of a cylinder, the axis of which is parallel to the direction of\n magnetization, and let a magnetic pole of unit strength be placed\n at the middle point of the axis.\n\n\nSince the generating lines of this cylinder are in the direction\n of magnetization, there will be no superficial distribution of\n magnetism on the curved surface, and since the circular ends of\n the cylinder are perpendicular to the direction of magnetization,\n there will be a uniform superficial distribution, of which the\n surface-density is $I$ for the negative end, and $-I$ for the\n positive end.\n\n\nLet the length of the axis of the cylinder be $2 b$, and its\n radius $a$. Then the force arising from this superficial distribu\ntion on a magnetic pole placed at the middle point of the axis\n is that due to the attraction of the disk on the positive side, and\n the repulsion of the disk on the negative side. These two forces\n are equal and in the same direction, and their sum is\n\n$$\\begin{equation*}\nR=4 \\pi I\\left(1-\\frac{b}{\\sqrt{a^{2}+b^{2}}}\\right) . \\tag{2}\n\\end{equation*}$$\n\n\nFrom this expression it appears that the force depends, not\n on the absolute dimensions of the cavity, but on the ratio of the\n length to the diameter of the cylinder. Hence, however small\n we make the cavity, the force arising from the surface distribu\ntion on its walls will remain, in general, finite.\n\n397.] We have hitherto supposed the magnetization to be\n uniform and in the same direction throughout the whole of the\n portion of the magnet from which the cylinder is hollowed out.\n When the magnetization is not thus restricted, there will in\n general be a distribution of imaginary magnetic matter through\n the substance of the magnet. The cutting out of the cylinder\n will remove part of this distribution, but since in similar solid\n figures the forces at corresponding points are proportional to the\n linear dimensions of the figures, the alteration of the force on\n the magnetic pole due to the volume-density of magnetic matter\n will diminish indefinitely as the size of the cavity is diminished,`);
            </script>

            <div class="markdown-content" id="md-page-51"></div>
            <script>
                document.getElementById('md-page-51').innerHTML = marked.parse(`\nwhile the effect due to the surface-density on the walls of the\n cavity remains, in general, finite.\n\n\nIf, therefore, we assume the dimensions of the cylinder so\n small that the magnetization of the part removed may be\n regarded as everywhere parallel to the axis of the cylinder, and\n of constant magnitude $I$, the force on a magnetic pole placed at\n the middle point of the axis of the cylindrical hollow will be\n compounded of two forces. The first of these is that due to the\n distribution of magnetic matter on the outer surface of the\n magnet, and throughout its interior, exclusive of the portion\n hollowed out. The components of this force are $a, \\beta$ and $\\gamma$,\n derived from the potential by equations (1). The second is the\n force $R$, acting along the axis of the cylinder in the direction of\n magnetization. The value of this force depends on the ratio of\n the length to the diameter of the cylindric cavity.\n\n398.] Case I. Let this ratio be very great, or let the diameter\n of the cylinder be small compared with its length. Expanding\n the expression for $R$ in powers of $\\frac{a}{b}$, we find\n\n$$\\begin{equation*}\nR=4 \\pi I\\left\\{\\frac{1}{2} \\frac{a^{2}}{b^{2}}-\\frac{3}{8} \\frac{a^{4}}{b^{4}}+\\& \\mathrm{c} .\\right\\}, \\tag{3}\n\\end{equation*}$$\n\na quantity which vanishes when the ratio of $b$ to $a$ is made\n infinite. Hence, when the cavity is a very narrow cylinder\n with its axis parallel to the direction of magnetization, the\n magnetic force within the cavity is not affected by the surface\n distribution on the ends of the cylinder, and the components of\n this force are simply $a, \\beta, \\gamma$, where\n\n$$\\begin{equation*}\na=-\\frac{d V}{d x}, \\quad \\beta=-\\frac{d V}{d y}, \\quad \\gamma=-\\frac{d V}{d z} . \\tag{4}\n\\end{equation*}$$\n\n\nWe shall define the force within a cavity of this form as the\n magnetic force within the magnet. Sir William Thomson has\n called this the Polar definition of magnetic force. When we\n have occasion to consider this force as a vector we shall denote\n it by H.\n\n399.] Case II. Let the length of the cylinder be very small\n compared with its diameter, so that the cylinder becomes a thin\n disk. Expanding the expression for $R$ in powers of $\\frac{b}{a}$, it becomes\n\n$$\\begin{equation*}\nR=4 \\pi I\\left\\{1-\\frac{b}{a}+\\frac{1}{2} \\frac{b^{3}}{a^{3}}-\\text { \\&c. }\\right\\}, \\tag{5}\n\\end{equation*}$$`);
            </script>

            <div class="markdown-content" id="md-page-52"></div>
            <script>
                document.getElementById('md-page-52').innerHTML = marked.parse(`\nthe ultimate value of which, when the ratio of $a$ to $b$ is made\n infinite, is $4 \\pi I$.\n\n\nHence, when the cavity is in the form of a thin disk, whose\n plane is normal to the direction of magnetization, a unit mag\nnetic pole placed at the middle of the axis experiences a force\n $4 \\pi I$ in the direction of magnetization, arising from the super\nficial magnetism on the circular surfaces of the disk *.\n\n\nSince the components of $I$ are $A, B$ and $C$, the components of\n this force are $4 \\pi A, 4 \\pi B$, and $4 \\pi C$. This must be compounded\n with the force whose components are $\\alpha, \\beta, \\gamma$.\n\n400.] Let the actual force on the unit pole be denoted by the\n vector $\\mathfrak{B}$, and its components by $a, b$ and $c$, then\n\n$$\\left.\\begin{array}{l}\na=a+4 \\pi A,  \\tag{6}\\\\\nb=\\beta+4 \\pi B, \\\\\nc=\\gamma+4 \\pi C .\n\\end{array}\\right\\}$$\n\n\nWe shall define the force within a hollow disk, whose plane\n sides are normal to the direction of magnetization, as the Mag\nnetic Induction within the magnet. Sir William Thomson has\n called this the Electromagnetic definition of magnetic force.\n\n\nThe three vectors, the magnetization $\\mathfrak{I}$, the magnetic force $\\mathfrak{H}$,\n and the magnetic induction $\\mathfrak{B}$, are connected by the vector\n equation\n\n$$\\begin{equation*}\n\\mathfrak{B}=\\mathfrak{H}+4 \\pi \\mathfrak{I} . \\tag{7}\n\\end{equation*}$$\n\n\n\\section*{Line-Integrul of Magnetic Force.}\n\n401.] Since the magnetic force, as defined in Art. 398, is that\n due to the distribution of free magnetism on the surface and\n through the interior of the magnet, and is not affected by the\n surface-magnetism of the cavity, it may be derived directly from\n the general expression for the potential of the magnet, and the\n\n\n\\section*{* On the force within cavities of other furms.}\n\n1. Any narrow crevasse. The force arising from the surface-magnetism is\n $4 \\pi I$ cos $\\epsilon$ in the direction of the normal to the plane of the crevasse, vhere $\\epsilon$ is the\n angle between this normal and the direction of magnetization. When the crevasse\n is parallel to the direction of magnetization the force is the magnetic force $\\mathfrak{H}$; when\n the crevasse is perpendicular to the direction of magnetization the force is the\n magnetic induction $\\mathfrak{B}$.\n\n2. In an infinitely elongated cylinder, the axis of which makes an angle $\\epsilon$ with the\n direction of magnetization, the force arising from the surface-magnetism is $2 \\pi I \\sin \\epsilon$,\n perpendicular to the axis in the plane containing the axis and the direction of\n magnetization.\n\n3. In a sphere the force arising from surface magnetism is $\\frac{4}{3} \\pi I$ in the direction of\n magnotisation.`);
            </script>

            <div class="markdown-content" id="md-page-53"></div>
            <script>
                document.getElementById('md-page-53').innerHTML = marked.parse(`\nline-integral of the magnetic force taken along any curve from\n the point $A$ to the point $B$ is\n\n$$\\begin{equation*}\n\\int_{A}^{B}\\left(a \\frac{d x}{d s}+\\beta \\frac{d y}{d s}+\\gamma \\frac{d z}{d s}\\right) d s=V_{A}-V_{B} \\tag{8}\n\\end{equation*}$$\n\nwhere $V_{A}$ and $V_{B}$ denote the potentials at $A$ and $B$ respectively.\n\n\n\\section*{Surface-Integral of Magnetic Induction.}\n\n402.] The magnetic induction through the surface $S$ is defined\n as the value of the integral\n\n$$\\begin{equation*}\nQ=\\iint \\mathfrak{B} \\cos \\epsilon d S, \\tag{9}\n\\end{equation*}$$\n\nwhere $\\mathfrak{B}$ denotes the magnitude of the magnetic induction at the\n element of surface $d S$, and $\\epsilon$ the angle between the direction of\n the induction and the normal to the element of surface, and the\n integration is to be extended over the whole surface, which may\n be either closed or bounded by a closed curve.\n\n\nIf $a, b, c$ denote the components of the magnetic induction, and\n $\\iota, m, n$ the direction-cosines of the normal, the surface-integral\n may be written\n\n$$\\begin{equation*}\nQ=\\iint(l a+m b+n c) d S \\tag{10}\n\\end{equation*}$$\n\n\nIf we substitute for the components of the magnetic induction\n their values in terms of those of the magnetic force, and the\n magnetization as given in Art. 400, we find\n\n$$\\begin{equation*}\nQ=\\iint(l a+m \\beta+n \\gamma) d S+4 \\pi \\iint(l A+m B+n C) d S . \\tag{11}\n\\end{equation*}$$\n\n\nWe shall now suppose that the surface over which the integra\ntion extends is a closed one, and we shall investigate the value\n of the two terms on the right-hand side of this equation.\n\n\nSince the mathematical form of the relation between magnetic\n furce and free magnetism is the same as that between electric\n force and free electricity, we may apply the result given in\n Art. 77 to the first ierm in the value of $Q$ by substituting $\\alpha, \\beta, \\gamma$,\n the components of magnetic force, for $X, Y, Z$, the components\n of electric force in Art. 77, and $M$, the algebraic sum of the free\n magnetism within the closed surface, for $e$, the algebraic sum of\n the free electricity.\n\n\nWe thus obtain the equation\n\n$$\\begin{equation*}\n\\iint(l a+m \\beta+n \\gamma) d S=4 \\pi M . \\tag{12}\n\\end{equation*}$$`);
            </script>

    <div class="page-container">
        <div class="page-header">

            <div class="markdown-content" id="md-page-54"></div>
            <script>
                document.getElementById('md-page-54').innerHTML = marked.parse(`\n\nSince every magnetic particle has two poles, which are equal\n in numerical magnitude but of opposite signs, the algebraic sum\n of the magnetism of the particle is zero. Hence, those particles\n which are entirely within the closed surface $S$ can contribute\n nothing to the algebraic sum of the magnetism within $S$. The\n value of $M$ must therefore depend only on those magnetic\n particles which are cut by the surface $S$.\n\n\nConsider a small element of the magnet of length 8 and trans\nverse section $k^{2}$, magnetized in the direction of its length, so that\n the strength of its poles is $m$. The moment of this small\n magnet will be $m s$, and the intensity of its magnetization, being\n the ratio of the magnetic moment to the volume, will be\n\n$$\\begin{equation*}\nI=\\frac{m}{k^{2}} \\tag{13}\n\\end{equation*}$$\n\n\nLet this small magnet be cut by the surface $S$, so that the\n direction of magnetization makes an angle $\\epsilon^{\\prime}$ with the normal\n drawn outwards from the surface, then if $d S$ denotes the area of\n the section,\n\n$$\\begin{equation*}\nk^{2}=d S \\cos \\epsilon^{\\prime} \\tag{14}\n\\end{equation*}$$\n\n\nThe negative pole $-m$ of this magnet lies within the surface $S$.\n\nHence, if we denote by $d M$ the part of the free magnetism\n within $S$ which is contributed by this little magnet,\n\n$$\\begin{align*}\nd M=-m & =-I k^{2} \\\\\n& =-I \\cos \\epsilon^{\\prime} d S \\tag{15}\n\\end{align*}$$\n\n\nTo find $M$, the algebraic sum of the free magnetism within the\n closed surface $S$, we must integrate this expression over the\n closed surface, so that\n\n$$M=-\\iint I \\cos \\epsilon^{\\prime} d S$$\n\nor writing $A, B, C$ for the components of magnetization, and $l, m, n$\n for the direction-cosines of the normal drawn outwards,\n\n$$\\begin{equation*}\nM=-\\iint(l A+m B+n C) d S \\tag{16}\n\\end{equation*}$$\n\n\nThis gives us the value of the integral in the second term on\n the right-hand side of equation (11). The value of $Q$ in that\n equation may therefore be found from equations (12) and (16),\n\n$$\\begin{equation*}\nQ=4 \\pi M-4 \\pi M=0, \\tag{17}\n\\end{equation*}$$\n\nor, the surface-integral of the magnetic induction through any\n closed surface is zero.`);
            </script>
            
    </div>

            <div class="markdown-content" id="md-page-55"></div>
            <script>
                document.getElementById('md-page-55').innerHTML = marked.parse(`\n403.] If we assume as the closed surface that of the differ\nential element of volume $d \\boldsymbol{x} d y d z$, we obtain the equation\n\n$$\\begin{equation*}\n\\frac{d a}{d x}+\\frac{d b}{d y}+\\frac{d c}{d z}=0 . \\tag{18}\n\\end{equation*}$$\n\n\nThis is the solenoidal condition, which is always satisfied by\n the components of the magnetic induction.\n\n\nSince the distribution of magnetic induction is solenoidal, the\n induction through any surface bounded by a closed curve\n depends only on the form and position of the closed curve, and\n not on that of the surface itself.\n\n404.] Surfaces at every point of which\n\n$$\\begin{equation*}\nl a+m b+n c=0 \\tag{19}\n\\end{equation*}$$\n\nare called surfaces of no induction, and the intersection of two\n such surfaces is called a line of induction. The conditions that\n a curve, 8 , may be a line of induction are\n\n$$\\begin{equation*}\n\\frac{1}{a} \\frac{d x}{d s}=\\frac{1}{b} \\frac{d y}{d s}=\\frac{1}{c} \\frac{d z}{d s} . \\tag{20}\n\\end{equation*}$$\n\n\nA system of lines of induction drawn through every point\n of a closed curve forms a tubular surface called a Tube of\n induction.\n\n\nThe induction across any section of such a tube is the same.\n If the induction is unity the tube is called a Unit tube of in\nduction.\n\n\nAll that Faraday * says about lines of magnetic force and\n magnetic sphondyloids is mathematically true, if understood of\n the lines and tubes of magnetic induction.\n\n\nThe magnetic force and the magnetic induction are identical\n outside the magnet, but within the substance of the magnet they\n must be carefully distinguished.\n\n\nIn a straight uniformly magnetized bar the magnetic force\n due to the magnet itself is from the end which points north,\n which we call the positive pole, towards the south end or negative\n pole, both within the magnet and in the space without.\n\n\nThe magnetic induction, on the other hand, is from the\n positive pole to the negative outside the magnet, and from the\n negative pole to the positive within the magnet, so that the lines\n and tubes of induction are re-entering or cyclic figures.\n\n\n\\footnotetext{\n* Exp. Res., series xxviii.\n}`);
            </script>
            
    </div>

    <div class="page-container">
        <div class="page-header">
            <span>Page 56</span>
        </div>
        
            <div class="markdown-content" id="md-page-56"></div>
            <script>
                document.getElementById('md-page-56').innerHTML = marked.parse(`\n\nThe importance of the magnetic induction as a physical\n quantity will be more clearly seen when we study electro\nmagnetic phenomena. When the magnetic field is explored\n by a moving wire, as in Faraday's $E_{1^{\\prime}}$. Res. 3076, it is the\n magnetic induction and not the magnetic force which is directly\n measured.\n\n\n\\section*{The Vector-Potential of Magnetic Induction.}\n\n405.] Since, as we have shewn in Art. 403, the magnetic in\nduction through a surface bounded by a closed curve depends on\n the closed curve, and not on the form of the surface which is\n bounded by it, it must be possible to determine the induction\n through a closed curve by a process depending only on the\n nature of that curve, and not involving the construction of a\n surface forming a diaphragm of the curve.\n\n\nThis may be done by finding a vector $\\mathfrak{A}$ related to $\\mathfrak{B}$, the\n magnetic induction, in such a way that the line-integral of\n $\\mathfrak{A}$, extended round the closed curve, is equal to the surface\nintegral of $\\mathfrak{B}$, extended over a surface bounded by the closed\n curve.\n\n\nIf, in Art. 24, we write $F, G, H$ for the components of $\\mathfrak{A}$, and\n $a, b, c$ for the components of $\\mathfrak{B}$, we find for the relation between\n these components\n\n$$\\begin{equation*}\na=\\frac{d H}{d y}-\\frac{d G}{d z}, \\quad b=\\frac{d F}{d z}-\\frac{d H}{d x}, \\quad c=\\frac{d G}{d x}-\\frac{d F}{d y} . \\tag{21}\n\\end{equation*}$$\n\n\nThe vector $\\mathfrak{A}$, whose components are $F, G, H$, is called the\n vector-potential of magnetic induction.\n\n\nIf a magnetic molecule whose moment is $m$ and the direction\n of whose axis of magnetization is $(\\lambda, \\mu, \\nu)$ be at the origin of\n coordinates, the potential at a point $(x, y, z)$ distance $r$ from\n the origin is, by Art. 387,\n\n$$\\begin{gathered}\n-m\\left(\\lambda \\frac{d}{d x}+\\mu \\frac{d}{d y}+v \\frac{d}{d z}\\right) \\frac{1}{r} \\\\\n\\therefore \\quad c=m\\left(\\lambda \\frac{d^{2}}{d x d z}+\\mu \\frac{d^{2}}{d y d z}+v \\frac{d^{2}}{d z^{2}}\\right) \\frac{1}{r}\n\\end{gathered}$$\n\nwhich, by Laplace's equation, may be thrown into the form\n\n$$m \\frac{d}{d x}\\left(\\lambda \\frac{d}{d z}-\\nu \\frac{d}{d x}\\right) \\frac{1}{r}-m \\frac{d}{d y}\\left(\\nu \\frac{d}{d y}-\\mu \\frac{d}{d z}\\right) \\frac{1}{r} .$$\n\n\nThe quantities $a, b$ may be dealt with in a similar manner.`);
            </script>
            
    </div>

    <div class="page-container">

            <div class="markdown-content" id="md-page-57"></div>
            <script>
                document.getElementById('md-page-57').innerHTML = marked.parse(`\n\nHence\n\n$$\\begin{aligned}\nF & =m\\left(\\nu \\frac{d}{d y}-\\mu \\frac{d}{d z}\\right) \\frac{1}{r} \\\\\n& =\\frac{m(\\mu z-\\nu y)}{r^{3}}\n\\end{aligned}$$\n\n\nFrom this expression $G$ and $H$ may be found by symmetry.\n We thus see that the vector-potential at a given point, due to\n a magnetized particle placed at the origin, is numerically equal\n to the magnetic moment of the particle divided by the square\n of the radius vector and multiplied by the sine of the angle\n between the axis of magnetization and the radius vector, and the\n direction of the vector-potential is perpendicular to the plane of\n the axis of magnetization and the radius vector, and is such that\n to an eye looking in the positive direction along the axis of\n magnetization the vector-potential is drawn in the direction of\n rotation of the hands of a watch.\n\n\nHence, for a magnet of any form in which $A, B, C$ are the\n components of magnetization at the point ( $x, y, z$ ), the compo\nnents of the vector-potential at the point ( $\\xi, \\eta, \\zeta$ ), are\n\n$$\\left.\\begin{array}{l}\nF=\\iiint\\left(B \\frac{d p}{d z}-C \\frac{d p}{d y}\\right) d x d y d z  \\tag{22}\\\\\nG=\\iiint\\left(C \\frac{d p}{d x}-A \\frac{d p}{d z}\\right) d x d y d z \\\\\nH=\\iiint\\left(A \\frac{d p}{d y}-B \\frac{d p}{d x}\\right) d x d y d z\n\\end{array}\\right\\}$$\n\nwhere $p$ is put, for conciseness, for the reciprocal of the distance\n between the points $(\\xi, \\eta, \\zeta)$ and $(x, y, z)$, and the integrations are\n extended over the space occupied by the magnet.\n\n406.] The scalar, or ordinary, potential of magnetic force,\n Art. 385, becomes when expressed in the same notation,\n\n$$\\begin{equation*}\nV=\\iiint\\left(A \\frac{d p}{d x}+B \\frac{d p}{d y}+C \\frac{d p}{d z}\\right) d x d y d z \\tag{23}\n\\end{equation*}$$\n\n\nRemembering that $\\frac{d p}{d x}=-\\frac{d p}{d \\xi}$, and that the integral\n\n$$\\iiint A\\left(\\frac{d^{2} p}{d x^{2}}+\\frac{d^{2} p}{d y^{2}}+\\frac{d^{2} p}{d z^{2}}\\right) d x d y d z$$\n\nhas the value $-4 \\pi(A)$ when the point $(\\xi, \\eta, \\zeta)$ is included\n within the limits of integration, and is zero when it is not\n so included, ( $A$ ) being the value of $A$ at the point ( $\\xi, \\eta, \\zeta$ ),`);
